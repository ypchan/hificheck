<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">How CCS artefacts arise and how HiFiCheck classifies HiFi reads</title>
  <desc id="desc">A circular SMRTbell insert is read repeatedly and collapsed to one consensus. An internal adapter is excluded, a near-terminal inverted palindrome is excluded or an incomplete inversion is quarantined, while direct tandem rRNA operons and reads with no signal are retained. FASTA alone cannot determine read quality or prove molecular origin.</desc>
  <defs>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
      .subtitle { font-size: 18px; }
      .section { font-size: 22px; font-weight: 700; }
      .step { font-size: 17px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 14px; }
      .rowtitle { font-size: 17px; font-weight: 700; }
      .evidence { font-size: 17px; font-weight: 600; }
      .decision { font-size: 17px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#183449" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#6F8495" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1B8B87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Page -->
  <rect width="1600" height="1020" fill="#F6F8FB"/>
  <rect width="1600" height="124" fill="#17364C"/>
  <rect x="56" y="29" width="119" height="31" rx="15.5" fill="#D9F2EC"/>
  <text x="115.5" y="50" text-anchor="middle" class="font label" fill="#176F68">HiFiCheck</text>
  <text x="192" y="58" class="font title" fill="#FFFFFF">From circular consensus to read-level decisions</text>
  <text x="58" y="95" class="font subtitle" fill="#CBDBE5">An automated FASTA screen that separates CCS-like artefact signals from possible biological rRNA tandems</text>

  <!-- Section 1 -->
  <rect x="54" y="148" width="1492" height="258" rx="20" fill="#FFFFFF" stroke="#DCE5EB" filter="url(#shadow)"/>
  <rect x="79" y="171" width="42" height="30" rx="10" fill="#DCEBEF"/>
  <text x="100" y="192" text-anchor="middle" class="font label" fill="#255D78">01</text>
  <text x="137" y="193" class="font section" fill="#17364C">Normal CCS: repeated passes over one SMRTbell molecule</text>
  <rect x="1198" y="171" width="318" height="30" rx="15" fill="#E5F3EF"/>
  <text x="1357" y="192" text-anchor="middle" class="font label" fill="#217A68">one molecule → one HiFi read</text>

  <!-- Circular template -->
  <circle cx="185" cy="289" r="60" fill="#F0FAF7" stroke="#1F8A81" stroke-width="13"/>
  <path d="M144 244 A60 60 0 0 1 161 233" fill="none" stroke="#E0A64B" stroke-width="14" stroke-linecap="round"/>
  <path d="M226 334 A60 60 0 0 1 210 345" fill="none" stroke="#E0A64B" stroke-width="14" stroke-linecap="round"/>
  <path d="M182 205 C218 203 244 220 251 248" fill="none" stroke="#1F8A81" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="185" y="294" text-anchor="middle" class="font step" fill="#1A5C59">insert</text>
  <text x="185" y="371" text-anchor="middle" class="font step" fill="#17364C">circular template</text>
  <text x="185" y="392" text-anchor="middle" class="font small" fill="#637B8C">gold = SMRTbell adapter</text>

  <line x1="286" y1="290" x2="357" y2="290" stroke="#6F8495" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Passes -->
  <text x="410" y="238" class="font step" fill="#17364C">Repeated observations</text>
  <g stroke-linecap="round">
    <line x1="413" y1="266" x2="740" y2="266" stroke="#AFCAD0" stroke-width="13"/>
    <line x1="413" y1="301" x2="740" y2="301" stroke="#AFCAD0" stroke-width="13"/>
    <line x1="413" y1="336" x2="740" y2="336" stroke="#AFCAD0" stroke-width="13"/>
    <line x1="437" y1="266" x2="713" y2="266" stroke="#2D86A2" stroke-width="13"/>
    <line x1="437" y1="301" x2="713" y2="301" stroke="#2D86A2" stroke-width="13"/>
    <line x1="437" y1="336" x2="713" y2="336" stroke="#2D86A2" stroke-width="13"/>
  </g>
  <g fill="#E0A64B">
    <rect x="416" y="257" width="15" height="18" rx="3"/><rect x="719" y="257" width="15" height="18" rx="3"/>
    <rect x="416" y="292" width="15" height="18" rx="3"/><rect x="719" y="292" width="15" height="18" rx="3"/>
    <rect x="416" y="327" width="15" height="18" rx="3"/><rect x="719" y="327" width="15" height="18" rx="3"/>
  </g>
  <g class="font label" fill="#537082">
    <text x="756" y="271">pass 1</text><text x="756" y="306">pass 2</text><text x="756" y="341">pass 3</text>
  </g>
  <text x="590" y="380" text-anchor="middle" class="font small" fill="#637B8C">adapter calls delimit passes</text>

  <line x1="830" y1="290" x2="900" y2="290" stroke="#6F8495" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Consensus -->
  <text x="970" y="238" class="font step" fill="#17364C">Circular consensus</text>
  <rect x="969" y="270" width="472" height="45" rx="10" fill="#E1F2EE" stroke="#2A8A7C" stroke-width="2"/>
  <rect x="980" y="280" width="450" height="25" rx="7" fill="#279483"/>
  <path d="M1004 292 H1399" stroke="#C8EBE2" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="1205" y="371" text-anchor="middle" class="font step" fill="#17364C">one consensus sequence per molecule</text>
  <text x="1205" y="392" text-anchor="middle" class="font small" fill="#637B8C">technical patterns may still be visible in exported FASTA</text>

  <!-- Section 2 -->
  <rect x="54" y="429" width="1492" height="470" rx="20" fill="#FFFFFF" stroke="#DCE5EB" filter="url(#shadow)"/>
  <rect x="79" y="451" width="42" height="30" rx="10" fill="#DCEBEF"/>
  <text x="100" y="472" text-anchor="middle" class="font label" fill="#255D78">02</text>
  <text x="137" y="473" class="font section" fill="#17364C">Sequence patterns in a FASTA read and the automatic action</text>
  <text x="133" y="506" class="font label" fill="#647F90">READ STRUCTURE</text>
  <text x="914" y="506" class="font label" fill="#647F90">HIFICHECK SIGNAL</text>
  <text x="1285" y="506" class="font label" fill="#647F90">ACTION</text>

  <!-- Row A: Internal adapter -->
  <rect x="77" y="518" width="1446" height="84" rx="13" fill="#FFF9F3" stroke="#F1E2CF"/>
  <circle cx="104" cy="560" r="17" fill="#D89A45"/><text x="104" y="566" text-anchor="middle" class="font label" fill="#FFFFFF">A</text>
  <text x="136" y="542" class="font rowtitle" fill="#17364C">Adapter retained inside a read</text>
  <rect x="137" y="553" width="279" height="24" rx="5" fill="#3787A1"/>
  <rect x="417" y="553" width="28" height="24" rx="3" fill="#E0A64B"/>
  <rect x="446" y="553" width="305" height="24" rx="5" fill="#3787A1"/>
  <text x="427" y="589" text-anchor="middle" class="font small" fill="#946221">adapter</text>
  <line x1="777" y1="560" x2="836" y2="560" stroke="#98AAB5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="866" y="554" class="font evidence" fill="#9B6729">internal adapter match</text>
  <text x="866" y="578" class="font small" fill="#6D7F8D">both strands; library-specific reference</text>
  <rect x="1241" y="537" width="247" height="46" rx="12" fill="#F8E2DC"/>
  <text x="1364.5" y="566" text-anchor="middle" class="font decision" fill="#AA4D43">exclude_adapter</text>

  <!-- Row B: Inverted palindrome -->
  <rect x="77" y="610" width="1446" height="84" rx="13" fill="#FFF7F7" stroke="#F0D9DC"/>
  <circle cx="104" cy="652" r="17" fill="#C66A72"/><text x="104" y="658" text-anchor="middle" class="font label" fill="#FFFFFF">B</text>
  <text x="136" y="634" class="font rowtitle" fill="#17364C">Possible missed adapter → reverse-complement read-through</text>
  <rect x="137" y="645" width="266" height="24" rx="5" fill="#3787A1"/>
  <rect x="404" y="645" width="24" height="24" rx="3" fill="#FFF7F7" stroke="#D89A45" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="416" y="662" text-anchor="middle" class="font label" fill="#B77E34">?</text>
  <rect x="429" y="645" width="322" height="24" rx="5" fill="#587DA8"/>
  <text x="272" y="662" text-anchor="middle" class="font label" fill="#FFFFFF">segment →</text>
  <text x="587" y="662" text-anchor="middle" class="font label" fill="#FFFFFF">← reverse complement</text>
  <line x1="777" y1="652" x2="836" y2="652" stroke="#98AAB5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="866" y="646" class="font evidence" fill="#A54F5B">long inverted arms</text>
  <text x="866" y="670" class="font small" fill="#6D7F8D">near read end + short junction?</text>
  <rect x="1241" y="629" width="247" height="46" rx="12" fill="#F7DEE1"/>
  <text x="1364.5" y="648" text-anchor="middle" class="font decision" fill="#A54F5B">exclude_palindrome</text>
  <text x="1364.5" y="666" text-anchor="middle" class="font small" fill="#A54F5B">otherwise quarantine</text>

  <!-- Row C: Biological direct tandem -->
  <rect x="77" y="702" width="1446" height="84" rx="13" fill="#F4FBF8" stroke="#CCE9DB"/>
  <circle cx="104" cy="744" r="17" fill="#2A9475"/><text x="104" y="750" text-anchor="middle" class="font label" fill="#FFFFFF">C</text>
  <text x="136" y="726" class="font rowtitle" fill="#17364C">Possible genuine tandem rRNA operons in one insert</text>
  <g class="font small" text-anchor="middle" fill="#FFFFFF">
    <rect x="137" y="737" width="92" height="25" rx="4" fill="#388A9F"/><text x="183" y="754">SSU</text>
    <rect x="230" y="737" width="74" height="25" rx="4" fill="#2E9C84"/><text x="267" y="754">ITS</text>
    <rect x="305" y="737" width="91" height="25" rx="4" fill="#347E7C"/><text x="350" y="754">LSU</text>
    <rect x="397" y="737" width="67" height="25" rx="4" fill="#D8E5E4"/><text x="430" y="754" fill="#51706F">IGS</text>
    <rect x="465" y="737" width="92" height="25" rx="4" fill="#388A9F"/><text x="511" y="754">SSU</text>
    <rect x="558" y="737" width="74" height="25" rx="4" fill="#2E9C84"/><text x="595" y="754">ITS</text>
    <rect x="633" y="737" width="91" height="25" rx="4" fill="#347E7C"/><text x="678" y="754">LSU</text>
  </g>
  <line x1="777" y1="744" x2="836" y2="744" stroke="#98AAB5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="866" y="738" class="font evidence" fill="#257D63">long direct self-repeat</text>
  <text x="866" y="762" class="font small" fill="#6D7F8D">no adapter / inverted signal</text>
  <rect x="1241" y="721" width="247" height="46" rx="12" fill="#DDF3E8"/>
  <text x="1364.5" y="739" text-anchor="middle" class="font decision" fill="#21745A">keep_direct_repeat</text>
  <text x="1364.5" y="758" text-anchor="middle" class="font small" fill="#21745A">one read = one molecule</text>

  <!-- Row D: No signal -->
  <rect x="77" y="794" width="1446" height="84" rx="13" fill="#F4F8FC" stroke="#DCE8F1"/>
  <circle cx="104" cy="836" r="17" fill="#5A8EB8"/><text x="104" y="842" text-anchor="middle" class="font label" fill="#FFFFFF">D</text>
  <text x="136" y="818" class="font rowtitle" fill="#17364C">No screened structural signal</text>
  <rect x="137" y="829" width="587" height="24" rx="6" fill="#3B87A0"/>
  <path d="M152 841 H706" stroke="#A8D5DD" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="777" y1="836" x2="836" y2="836" stroke="#98AAB5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="866" y="830" class="font evidence" fill="#527796">no selected match</text>
  <text x="866" y="854" class="font small" fill="#6D7F8D">absence of signal ≠ proof of no artefact</text>
  <rect x="1241" y="813" width="247" height="46" rx="12" fill="#DFEDF7"/>
  <text x="1364.5" y="842" text-anchor="middle" class="font decision" fill="#356F9A">keep</text>

  <!-- Boundary/limitation bar -->
  <rect x="54" y="923" width="1492" height="71" rx="17" fill="#E9EFF3" stroke="#D5E0E8"/>
  <circle cx="88" cy="958" r="17" fill="#617B8C"/>
  <text x="88" y="965" text-anchor="middle" class="font section" fill="#FFFFFF">!</text>
  <text x="122" y="950" class="font step" fill="#28475A">FASTA-only evidence</text>
  <text x="122" y="975" class="font small" fill="#516E7E">No quality values, CCS pass counts or BAM tags. Confirm operon order with ITSx and require independent-read support downstream.</text>
  <text x="1521" y="1010" text-anchor="end" class="font small" fill="#7D919F">HiFiCheck • conceptual schematic • not to scale</text>
</svg>
